services:
  mysql:
    image: mysql:8.4
    container_name: pkms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pkms_db
      MYSQL_USER: pkms_user
      MYSQL_PASSWORD: pkms_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - pkms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u pkms_user -ppkms_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pkms-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/pkms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: pkms_user
      DB_PASSWORD: pkms_password
      REMEMBER_ME_KEY: change-this-compose-secret-before-deployment
      APP_SEED_ENABLED: "true"
      JPA_DDL_AUTO: update
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  pkms_mysql_data:
