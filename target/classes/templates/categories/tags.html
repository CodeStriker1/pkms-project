<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tags')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container-fluid px-4 py-4">
    <div class="page-title"><div><h1>Tags</h1><p>Connect notes across categories</p></div></div>
    <div class="management-grid">
        <form class="panel-form" th:action="@{/tags}" th:object="${tagForm}" method="post">
            <h2>New Tag</h2>
            <input class="form-control" th:field="*{name}" placeholder="Name" required>
            <input class="form-control form-control-color" type="color" th:field="*{color}">
            <button class="btn btn-primary" type="submit">Save Tag</button>
        </form>
        <div class="list-panel">
            <div class="list-row" th:each="tag : ${tags}">
                <div class="d-flex align-items-center gap-2">
                    <span class="color-dot" th:style="'background:' + ${tag.color}"></span>
                    <h3 class="mb-0" th:text="${tag.name}">Tag</h3>
                </div>
                <form th:action="@{/tags/{id}/delete(id=${tag.id})}" method="post">
                    <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                </form>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/nav :: scripts}"></div>
</body>
</html>
