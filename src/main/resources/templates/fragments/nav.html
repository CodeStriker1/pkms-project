<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg sticky-top app-nav">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}"><i class="bi bi-journal-richtext me-2"></i>PKMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/notes}">Notes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/favorites}">Favorites</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/archive}">Archive</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/trash}">Trash</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/categories}">Categories</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tags}">Tags</a></li>
            </ul>
            <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-sm btn-outline-secondary icon-btn" id="themeToggle" type="button" title="Toggle theme">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <a class="btn btn-sm btn-primary" th:href="@{/notes/new}"><i class="bi bi-plus-lg me-1"></i>New</a>
                <a class="nav-profile" th:if="${navUser}" th:href="@{/profile}">
                    <span class="avatar avatar-sm" th:text="${navUser.initials}">U</span>
                    <span class="nav-profile-text">
                        <strong th:text="${navUser.preferredName}">User</strong>
                        <small th:text="${navUser.email}">email</small>
                    </span>
                </a>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-box-arrow-right"></i></button>
                </form>
            </div>
        </div>
    </div>
</nav>
<div th:fragment="alerts" class="container-fluid px-4 mt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<div th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</div>
</body>
</html>
