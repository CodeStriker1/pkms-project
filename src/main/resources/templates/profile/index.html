<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Profile')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container-fluid px-4 py-4">
    <div class="page-title"><div><h1>Profile</h1><p>Manage account information and password</p></div></div>
    <div class="management-grid">
        <form class="panel-form" th:action="@{/profile}" th:object="${profileForm}" method="post">
            <h2>Account</h2>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            <input class="form-control" th:field="*{name}" placeholder="Name" required>
            <input class="form-control" type="email" th:field="*{email}" placeholder="Email" required>
            <button class="btn btn-primary" type="submit">Update Profile</button>
        </form>
        <form class="panel-form" th:action="@{/profile/password}" th:object="${passwordForm}" method="post">
            <h2>Password</h2>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            <input class="form-control" type="password" th:field="*{currentPassword}" placeholder="Current password" required>
            <input class="form-control" type="password" th:field="*{newPassword}" placeholder="New password" required>
            <input class="form-control" type="password" th:field="*{confirmPassword}" placeholder="Confirm password" required>
            <button class="btn btn-dark" type="submit">Change Password</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/nav :: scripts}"></div>
</body>
</html>
