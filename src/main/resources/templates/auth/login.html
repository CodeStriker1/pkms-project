<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel">
        <div class="brand-mark"><i class="bi bi-journal-richtext"></i></div>
        <h1>Personal Knowledge Management System</h1>
        <p class="text-muted">Securely organize notes, categories, tags, research ideas, and project knowledge.</p>
        <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <form th:action="@{/login}" method="post" class="vstack gap-3">
            <div>
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" value="student@example.com" required autofocus>
            </div>
            <div>
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" value="password123" required>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <p class="mt-4 mb-0 text-center">New user? <a th:href="@{/register}">Create an account</a></p>
    </section>
</main>
<div th:replace="~{fragments/nav :: scripts}"></div>
</body>
</html>
