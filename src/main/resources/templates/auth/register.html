<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel">
        <div class="brand-mark"><i class="bi bi-person-plus"></i></div>
        <h1>Create Account</h1>
        <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="vstack gap-3">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            <div>
                <label class="form-label">Name</label>
                <input class="form-control" th:field="*{name}" required>
                <div class="invalid-text" th:errors="*{name}"></div>
            </div>
            <div>
                <label class="form-label">Email</label>
                <input class="form-control" type="email" th:field="*{email}" required>
                <div class="invalid-text" th:errors="*{email}"></div>
            </div>
            <div>
                <label class="form-label">Password</label>
                <input class="form-control" type="password" th:field="*{password}" required>
                <div class="invalid-text" th:errors="*{password}"></div>
            </div>
            <div>
                <label class="form-label">Confirm Password</label>
                <input class="form-control" type="password" th:field="*{confirmPassword}" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Register</button>
        </form>
        <p class="mt-4 mb-0 text-center">Already registered? <a th:href="@{/login}">Login</a></p>
    </section>
</main>
<div th:replace="~{fragments/nav :: scripts}"></div>
</body>
</html>
