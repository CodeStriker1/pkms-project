<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${note.title})}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container-fluid px-4 py-4">
    <article class="reader">
        <div class="reader-toolbar">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/notes}"><i class="bi bi-arrow-left"></i></a>
            <div class="d-flex gap-2 flex-wrap">
                <form th:action="@{/notes/{id}/favorite(id=${note.id})}" method="post">
                    <button class="btn btn-sm" th:classappend="${favorite} ? 'btn-warning' : 'btn-outline-warning'" type="submit">
                        <i class="bi" th:classappend="${favorite} ? ' bi-star-fill' : ' bi-star'"></i>
                    </button>
                </form>
                <form th:action="@{/notes/{id}/archive(id=${note.id})}" method="post">
                    <button class="btn btn-sm btn-outline-secondary" type="submit"><i class="bi bi-archive me-1"></i><span th:text="${note.archived} ? 'Unarchive' : 'Archive'"></span></button>
                </form>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/notes/{id}/export/txt(id=${note.id})}"><i class="bi bi-filetype-txt"></i></a>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/notes/{id}/export/pdf(id=${note.id})}"><i class="bi bi-filetype-pdf"></i></a>
                <a class="btn btn-sm btn-primary" th:href="@{/notes/{id}/edit(id=${note.id})}"><i class="bi bi-pencil-square me-1"></i>Edit</a>
                <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post">
                    <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                </form>
            </div>
        </div>
        <h1 th:text="${note.title}">Title</h1>
        <div class="note-meta mb-4">
            <span th:if="${note.category}" class="pill" th:style="'--pill:' + ${note.category.color}" th:text="${note.category.name}"></span>
            <span class="tag-pill" th:each="tag : ${note.tags}" th:style="'--pill:' + ${tag.color}" th:text="${tag.name}"></span>
        </div>
        <section class="ai-panel" th:data-note-id="${note.id}">
            <div>
                <span class="eyebrow">AI Assistant</span>
                <h2>Summarize this note</h2>
                <p>Generate a short study-friendly summary from your saved note content.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap justify-content-end">
                <button class="btn btn-sm btn-primary" type="button" id="aiSummaryButton">
                    <i class="bi bi-stars me-1"></i>Summarize
                </button>
                <button class="btn btn-sm btn-outline-primary" type="button" id="aiQuestionsButton">
                    <i class="bi bi-question-circle me-1"></i>Study Qs
                </button>
            </div>
            <div class="ai-output d-none" id="aiSummaryOutput" aria-live="polite"></div>
        </section>
        <div class="reader-content" th:utext="${note.content}"></div>
    </article>
</main>
<div th:replace="~{fragments/nav :: scripts}"></div>
</body>
</html>
