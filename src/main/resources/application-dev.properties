spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pkms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false

app.seed.enabled=${APP_SEED_ENABLED:true}
app.security.remember-me-key=${REMEMBER_ME_KEY:dev-remember-me-key}
