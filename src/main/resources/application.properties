spring.application.name=Personal Knowledge Management System

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pkms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.error.whitelabel.enabled=false
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

app.seed.enabled=${APP_SEED_ENABLED:true}
app.security.remember-me-key=${REMEMBER_ME_KEY:change-this-development-key}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
